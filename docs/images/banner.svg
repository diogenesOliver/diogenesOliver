<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" role="img" aria-label="Diogenes Oliveira - Visao computacional em tempo real">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101014"/>
      <stop offset="0.65" stop-color="#121216"/>
      <stop offset="1" stop-color="#1A1410"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#E0803C" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#E0803C" stop-opacity="0"/>
    </radialGradient>
    <style>
      .f  { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .m  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
      .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; fill: #E0803C; }
      .title   { font-size: 46px; font-weight: 800; fill: #F5F5F7; letter-spacing: -1px; }
      .sub     { font-size: 16.5px; fill: #C2C2CB; }
      .meta    { font-size: 11.5px; font-weight: 600; letter-spacing: 0.4px; fill: #C07A3E; }
      .pill    { font-size: 10.5px; fill: #B4B4BE; }
      .lbl     { font-size: 9px; font-weight: 700; letter-spacing: 1.4px; fill: #6E6E7A; }
      .val     { font-size: 11.5px; fill: #E6E6EC; }
      .valo    { font-size: 11.5px; fill: #E0803C; }
      .dim     { font-size: 10.5px; fill: #8A8A96; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="289" rx="16" fill="url(#bg)" stroke="#26262D"/>
  <rect x="0.5" y="0.5" width="899" height="289" rx="16" fill="url(#glow)"/>

  <g fill="#3A3A44">
    <circle cx="150" cy="40" r="1"/><circle cx="330" cy="26" r="1"/><circle cx="505" cy="60" r="1"/>
    <circle cx="70" cy="250" r="1"/><circle cx="250" cy="268" r="1"/><circle cx="430" cy="252" r="1"/>
    <circle cx="560" cy="230" r="1"/><circle cx="845" cy="258" r="1"/><circle cx="620" cy="268" r="1"/>
  </g>

  <text class="f eyebrow" x="44" y="54">VISÃO COMPUTACIONAL EM TEMPO REAL · NEXAI</text>
  <text class="f title"   x="44" y="106">Diógenes Oliveira</text>
  <text class="f sub"     x="44" y="142">Câmera RTSP + GPU NVIDIA →</text>
  <text class="f sub"     x="44" y="166">detecção, rastreamento e eventos de IA.</text>
  <text class="f meta"    x="44" y="196">DeepStream 7.1 · TensorRT · Python 3.10 · AWS + Terraform</text>

  <g>
    <rect x="44"  y="214" width="94" height="24" rx="12" fill="#17171C" stroke="#2C2C34"/>
    <text class="f pill" x="91"  y="229" text-anchor="middle">DeepStream</text>
    <rect x="146" y="214" width="80" height="24" rx="12" fill="#17171C" stroke="#2C2C34"/>
    <text class="f pill" x="186" y="229" text-anchor="middle">TensorRT</text>
    <rect x="234" y="214" width="66" height="24" rx="12" fill="#17171C" stroke="#2C2C34"/>
    <text class="f pill" x="267" y="229" text-anchor="middle">Python</text>
    <rect x="308" y="214" width="62" height="24" rx="12" fill="#17171C" stroke="#2C2C34"/>
    <text class="f pill" x="339" y="229" text-anchor="middle">Docker</text>
    <rect x="378" y="214" width="82" height="24" rx="12" fill="#17171C" stroke="#2C2C34"/>
    <text class="f pill" x="419" y="229" text-anchor="middle">Kubernetes</text>
    <rect x="468" y="214" width="78" height="24" rx="12" fill="#17171C" stroke="#2C2C34"/>
    <text class="f pill" x="507" y="229" text-anchor="middle">Terraform</text>
  </g>

  <g>
    <rect x="576" y="44" width="282" height="202" rx="12" fill="#141419" stroke="#2A2A33"/>
    <circle cx="596" cy="64" r="4.5" fill="#E05A4F"/>
    <circle cx="612" cy="64" r="4.5" fill="#E0A33C"/>
    <circle cx="628" cy="64" r="4.5" fill="#4FB06A"/>

    <text class="f lbl" x="596" y="98">ATUAÇÃO</text>
    <text class="m val" x="596" y="116">Computer Vision Developer</text>

    <text class="f lbl" x="596" y="142">PIPELINE</text>
    <rect x="594" y="150" width="120" height="19" rx="5" fill="#1C1C22" stroke="#2E2E38"/>
    <text class="m valo" x="602" y="163.5">nvinfer+tracker</text>
    <text class="m dim"  x="722" y="163.5">pyds · GStreamer</text>

    <text class="f lbl" x="596" y="190">AGORA</text>
    <rect x="594" y="198" width="152" height="19" rx="5" fill="#1C1C22" stroke="#2E2E38"/>
    <text class="m valo" x="602" y="211.5">kubernetes + terraform</text>

    <circle cx="840" cy="228" r="4.5" fill="#4FB06A">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
