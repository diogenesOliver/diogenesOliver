  <rect x="0.5" y="0.5" width="899" height="171" rx="16" fill="url(#nbg)" stroke="#26262D"/>
  <circle cx="52" cy="31" r="4" fill="#4FB06A"/>
  <text class="f hd" x="66" y="35">PERFIL · O QUE EU CONSTRUO</text>

  <g>
    <rect x="44"  y="52" width="152" height="96" rx="11" fill="#141419" stroke="#2A2A33"/>
