# Nome da Actions:
name: Snake Game

# Controlador do tempo que sera feito a atualização dos arquivos.
on:
  schedule:
      # Será atualizado a cada 5 horas.
    - cron: "0 */5 * * *"

# Permite executar na lista de Actions (utilizado para testes de build).
  workflow_dispatch:

  # Também atualiza a cada push na branch principal.
  push:
    branches:
      - main

# Permissão necessária para publicar os arquivos gerados.
permissions:
  contents: write

# Regras
jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    # Checks repo under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

    # Repositorio que será utilizado para gerar os arquivos.
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: diogenesOliver #Seu usuario
          # Uma saída por linha: versão clara, versão escura e o gif.
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=orange&color_dots=#bfbfbf,#139a43,#0b6031,#064222,#042f17

      - run: git status

      # Publica os arquivos gerados na branch "output".
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          # the output branch we mentioned above
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
